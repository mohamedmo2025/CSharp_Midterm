L[0].d=[
`تخيل الكمبيوتر زي طبقات. الـ Hardware هو الجسم: الـ CPU زي المخ، والـ Memory الذاكرة، وأجهزة الإدخال والإخراج. فوقه الـ Operating System (زي Windows) وهو المدير اللي بيتحكم في الجسم ويوزع الشغل. فوقه الـ Applications (زي Word وChrome) وهي بتحدد إزاي الموارد تتستخدم عشان تحل مشكلة المستخدم. وآخر حاجة الـ User وممكن يكون إنسان أو آلة. المهم للامتحان: مين بيعمل إيه؟ الـ OS بيتحكم في الـ Hardware، والـ Application بتحدد استخدام الموارد.`,
`البرنامج (Program) هو مجموعة أوامر لمهمة معينة، ومجموعة البرامج دي اسمها Software. المبرمج بيكتب الأوامر بلغة برمجة وده اسمه source code. الكمبيوتر مبيفهمش الكود مباشرة، فيا إما Interpreter يشغله زي Python، أو Compiler يحوله لبرنامج جاهز زي C++. الـ High-level زي x = a + b سهلة عليك، والـ Low-level زي LOAD وADD أقرب للآلة وأصعب في الكتابة.`,
`الـ Unstructured كأنك كتبت الكود كله في ورقة واحدة طويلة: ينفع للبرامج الصغيرة بس بيتلخبط في الكبيرة، وفيه تكرار وصعب في الـ debug (زي BASIC وCOBOL وFORTRAN القديمة). الـ Structured بيقسم الكود لـ modules أو functions، كل واحد ليه مهمة، فالقراءة والتعديل والتجربة أسهل ومفيش تكرار (C++ وC# وJava وPython). لو السؤال فيه modules يبقى Structured، ولو فيه one single block يبقى Unstructured.`,
`الـ Algorithm ببساطة وصفة: خطوات محددة بالترتيب لحل مشكلة. مثال دليل التليفون: تدور صفحة صفحة (صح بس بطيء)، أو صفحتين صفحتين (سريع بس ممكن تفوّت الاسم)، أو تفتح من النص وتشوف الاسم في أنهي نص وتكرر (صح وسريع). 1024 صفحة تخلص في 10 خطوات بس لأن كل مرة بتنصّف. الـ Pseudocode هو كتابة الخوارزمية بلغة شبه إنجليزي للبني آدم، مش للآلة ومينفعش يتعمله compile.`,
`الـ Flowchart رسمة بتوضح الخطوات بالأشكال والأسهم. احفظ الأشكال: البيضاوي (Terminator) للبداية والنهاية، المستطيل للعملية، المعين (Diamond) للقرار yes/no، متوازي الأضلاع للإدخال والإخراج، والسهم لاتجاه السير. ركز على إن المعين = قرار لأنه بيجي كتير في الامتحان.`,
`C# لغة عامة الاستخدام من Microsoft وبتتستخدم في ألعاب Unity. بنكتب الكود في IDE زي Visual Studio، والـ IDE يعني Integrated Development Environment: بيئة بتساعدك تكتب وتعمل compile. الـ compiler بيحول كود C# لـ CIL مش لكود الآلة مباشرة، وعشان الجهاز يشغل الـ CIL لازم يكون عليه .NET Framework.`
];
L[1].d=[
`البرنامج زي عرايس الماتريوشكا: الأكبر namespace (مجموعة منظمة)، جواه class، جواه method، وجواها statements وهي الأوامر. ممكن namespace يبقى جواه namespace تاني. مثلاً System هو namespace فيه class اسمه Console وفيه methods زي Write. احفظ الترتيب: namespace ثم class ثم method ثم statement.`,
`الـ Main هي الباب اللي البرنامج بيدخل منه: أي كود جواها بيتنفذ أول ما تشغل، ولازم تكون موجودة في أي برنامج. السطر Console.Write("Hello World!"); معناه: من namespace اسمه System، class اسمه Console، استخدم method اسمها Write وابعتلها النص. النص لازم بين علامات تنصيص مزدوجة، وكل أمر ينتهي بـ ; ولو نسيتها هيطلع error. وكمان C# بتفرّق بين الحروف الكبيرة والصغيرة: write غير Write.`,
`بدل ما تكتب System.Console.Write كل مرة، بتكتب في أول الملف using System; فتقدر تكتب Console.Write على طول. الـ using بتضيف namespace للبرنامج بس، ومبتغيرش حاجة تانية.`,

L[2].sen=['A data type sets the size of a variable and the kind of data it stores; the right type avoids errors and saves memory.','<b>bool</b> = 1 byte. <b>char</b> = 2 bytes, UTF-16. <b>string</b> = reference type (4 bytes on 32-bit, 8 on 64-bit).','Signed integers: leftmost bit is the sign bit (sbyte = 1 sign bit + 7 value bits). Unsigned types have no sign bit (zero and positive only).','<b>Integer overflow</b>: the result is outside the type range and the extra bit is lost (uint max + 5 gives 4).','Floating literals: no suffix = double, f/F = float, d/D = double, m/M = decimal.','<b>Value types</b> store the data. <b>Reference types</b> (string, arrays, objects) store the address of the data.','<b>Implicit conversion</b>: no data loss, automatic (int to long, int to float).','<b>Explicit conversion (cast)</b>: possible data loss, needs <code>(type)</code>; long to int also needs a cast; <code>(int)2.5f</code> = 2.','<code>Convert.ToInt32</code> rounds; a cast truncates.','<code>Console.ReadLine()</code> returns a string; use <code>int.Parse</code> or <code>Convert.ToInt32</code>. Parsing is an explicit conversion.'];

`أي رقم عشري من غير حرف في الآخر بيتعامل كـ double. لو كتبت f يبقى float، وd يبقى double، وm يبقى decimal. فلو عايز float لازم تكتب 5.35f.`,

`الـ value type المتغير بيخزن القيمة نفسها (bool, char, كل الأعداد). الـ reference type المتغير بيخزن عنوان بيشاور على البيانات (string, arrays, objects). int x = 5 يعني في x القيمة 5 مباشرة، لكن string s = "Hello" يعني في s عنوان بيشاور على كلمة Hello.`,
`الـ Implicit بيحصل تلقائي لما القيمة تتحط في النوع الجديد من غير خسارة، زي int لـ long أو int لـ float. لو ممكن تخسر بيانات (double لـ int بتضيع الكسر، long لـ int ممكن يضيق) لازم Explicit conversion اسمه Cast: بتكتب النوع بين أقواس (int)x، ومن غيره يطلع error. (int)2.5f تساوي 2 لأنها بتشيل الكسر، بينما Convert.ToInt32 بتقرب.`,

L[3].sen=['Arithmetic: + - * / %. int / int = int (5/2 = 2), 5 % 2 = 1, (double)5 / 2 = 2.5.','Operands should have the same type; otherwise one is implicitly converted.','<b>++x</b> (prefix) increases then uses; <b>x++</b> (postfix) uses then increases.','Assignment shorthands: <code>x += 10</code> is <code>x = x + 10</code>.','Comparison operators (== != &gt; &lt; &gt;= &lt;=) return a <b>bool</b>.','<b>&amp;&amp;</b> true only if both true; <b>||</b> false only if both false; <b>!</b> reverses.','Arithmetic expression gives a number; logical expression gives true / false.','<code>?:</code> (ternary): <code>cond ? a : b</code>.','Concatenation with +; escape sequences: \\n new line, \\t tab, \\\\ backslash, \\" quote.','<b>Precedence</b>: x++, unary and ++x, * / %, + -, shift, comparisons, == !=, &amp;&amp;, ||, ?:, assignment.','Associativity: most operators go left to right; assignment goes right to left.','Short-circuit: <code>&amp;&amp;</code> and <code>||</code> skip the right operand when the left side decides the result.'];
L[3].d=[
`الـ / بين int وint بيطلع int: يعني 5 / 2 = 2 مش 2.5 لأن الكسر بيتشال. والـ % بيدي الباقي: 5 % 2 = 1. لو عايز 2.5 حوّل واحد منهم لـ double: (double)x / y والتاني بيتحول تلقائي. القاعدة: لو النوعين مختلفين بيتحول واحد للتاني والناتج بنفس النوع.`,
`الفرق في الترتيب: ++x (prefix) يزود الأول وبعدين يرجع القيمة الجديدة. x++ (postfix) يرجع القيمة القديمة وبعدين يزود. لو x = 5: y = ++x يخلي x = 6 وy = 6، أما y = x++ يخلي y = 5 وx = 6. والـ -- نفس الفكرة بس بينقص.`,
`x += 10 اختصار لـ x = x + 10، وكذلك -= و*= و/= و%=. يعني لو x = 12 وكتبت x += 10 يبقى x = 22.`,
`عمليات المقارنة ناتجها دايماً bool يا true يا false. خد بالك إن = للتخزين و== للمقارنة.`,
`&& (AND) ناتجه true لو الاتنين true بس. || (OR) ناتجه false لو الاتنين false بس. و! بتعكس القيمة: !true = false. احفظها: AND لازم الاتنين، OR كفاية واحد.`,
`الـ Expression إما حسابي (ناتجه رقم زي x + y) أو منطقي (ناتجه true/false زي x > y). في مثال علي وإبراهيم بنترجم الجملة لشرط: علي وصل بدري A <= 10، وعلي وصل بعد إبراهيم A > B، وعمرهم ما يتقابلوا X < B || Y < A (واحد خرج قبل ما التاني يوصل)، وإبراهيم قعد 5 ساعات على الأقل Y - B >= 5.`,
`العامل الثلاثي ?: اختصار لـ if..else بيرجع قيمة: الشرط ? لو صح : لو غلط. مثلاً score >= 50 ? "Pass" : "Fail" لو score = 40 يرجع Fail.`,
`العلامة + مع النصوص بتدمجهم من غير مسافات إلا لو حطيتها بنفسك، فـ "Result of" + x + "+" + y بتطلع Result of5+10. والبديل الـ placeholders: "{0} + {1}" بتتبدل بالـ arguments اللي بعد النص بالترتيب. لو كتبت نص من غير placeholders وحطيت arguments بعده، الزيادة بتتجاهل. وأي حاجة بين علامات تنصيص نص حرفي. الـ escape sequences: \\n سطر جديد، \\t مسافة tab، \\\\ باك سلاش، \\" علامة تنصيص.`,
`الترتيب من الأعلى للأقل: ++ و-- بعد المتغير، ثم الـ unary والـ prefix، ثم * / %، ثم + -، ثم << >>، ثم المقارنة، ثم == !=، ثم &&، ثم ||، ثم ?:، وآخر حاجة التخصيص. دي أهم حاجة في أسئلة الامتحان، زي 2 + 3 * 4 = 14. ولو نفس المستوى بنمشي من الشمال لليمين (13 / 5 / 2 = 1) إلا التخصيص من اليمين للشمال. الأقواس تغير الترتيب. خطوات الحل: طبق ++ أولاً، ثم * / %، ثم + -، ثم الـ shift.`,
`الـ && و|| بيشتغلوا بنظام short-circuit: لو الطرف الأيسر في && طلع false مبيقيمش الأيمن (لأن الناتج false أكيد)، ولو الأيسر في || طلع true مبيقيمش الأيمن. يعني لو الأيمن فيه ++x مش هيتنفذ. نفس الفكرة في ?: بتنفذ التعبير المختار بس.`
];

`الـ Branching يعني الخوارزمية تختار تعمل واحد من حاجتين أو أكتر. وفي C# عندنا تلات جمل: if وif..else وswitch.`,

let ST=null;
function quiz(qs,key,keep){
 const el=$("#qz");
 /* keep=true (language switch): continue the same quiz state; otherwise start a fresh random one */
 if(!(keep&&ST&&ST.key==key&&ST.qs===qs))
  ST={key,qs,a:sh(qs.map(x=>({...x,o:sh(x.o.map((u,i)=>[u,i==0]))}))),i:0,s:0,p:null};
 const S=ST,a=S.a,show=()=>{
  const t=tx(),en=lg()=="en";
  if(S.i>=a.length){const p=Math.round(S.s/a.length*100);
   el.innerHTML=`<div class=en>${C(`$ dotnet build\n${p>=60?"Build succeeded.":"Build failed."}\nScore: ${S.s}/${a.length} (${p}%)`,1)}</div><button class=pb id=ag>${t.again}</button>`;$("#ag").onclick=()=>{ST=null;quiz(qs,key,0)};return}
  const x=a[S.i],sc=S.s-(S.p!=null&&x.o[S.p][1]?1:0);
  el.innerHTML=`<p class=mut>${t.q(S.i+1,a.length,sc)}</p><div class=bar><u style="width:${S.i/a.length*100}%"></u></div><div class=en><p class=qt>${E(x.t)}</p>${x.k?C(x.k,0,x.st):""}${x.o.map((o,j)=>`<button class=o data-j=${j}>${E(o[0])}</button>`).join("")}</div><div id=fb></div>`;
  const fb=()=>{const j=S.p,ok=x.o[j][1];
   el.querySelectorAll(".o").forEach((c,k)=>{c.disabled=true;if(x.o[k][1])c.classList.add("ok");else if(k==j)c.classList.add("no")});
   $("#fb").innerHTML=`<details${ok?"":" open"}><summary>${ok?t.ok:t.no} &ndash; ${t.sol}</summary><p class=en>${t.ca}: <code>${E(x.o.find(o=>o[1])[0])}</code></p>${(en?x.ee:x.e)?`<p${en?" class=en":""}>${en?x.ee:x.e}</p>`:""}</details><button class=pb id=nx>${S.i+1<a.length?t.next:t.res}</button>`;
   $("#nx").onclick=()=>{S.i++;S.p=null;show()}};
  el.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
   if(S.p!=null)return;S.p=+b.dataset.j;if(x.o[S.p][1])S.s++;fb();$("#nx").scrollIntoView({block:"nearest"})});
  if(S.p!=null)fb()
 };show()
}

 M.innerHTML=`<div class=hero><span class=g>// Structure Programming</span>

 M.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>go(b.dataset.h));
